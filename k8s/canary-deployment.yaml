apiVersion: apps/v1
kind: Deployment

metadata:
  name: deployment-canary

spec:
  replicas: 1

  selector:
    matchLabels:
      app: popcorn-api
      version: canary

  template:
    metadata:
      labels:
        app: popcorn-api
        version: canary

    spec:
      containers:
        - name: nest-api

          image: us-central1-docker.pkg.dev/popcorn-api-491915-s3/popcorn-api-repo/nest-api:$COMMIT_SHA

          ports:
            - containerPort: 3000

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: DATABASE_URL