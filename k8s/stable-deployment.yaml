apiVersion: apps/v1
kind: Deployment

metadata:
  name: deployment-stable

spec:
  replicas: 3

  selector:
    matchLabels:
      app: popcorn-api
      version: stable

  template:
    metadata:
      labels:
        app: popcorn-api
        version: stable

    spec:
      containers:
        - name: nest-api

          image: us-central1-docker.pkg.dev/popcorn-api-491915-s3/popcorn-api-repo/nest-api:6e09936ee66f3f57a52be772daab6790b6f8fe08

          ports:
            - containerPort: 3000

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: DATABASE_URL